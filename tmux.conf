# Fix prefix
unbind C-b
set-option -g prefix C-a

# Refresh config
unbind-key r
bind-key r source-file ~/.tmux.conf

# Use ZSH
set-option -g default-shell /bin/zsh

# OSX fix
# set -g default-command "reattach-to-user-namespace -l /bin/zsh"

# Panes
bind-key C-a last-window
bind-key | split-window -h -c '#{pane_current_path}'
bind-key \\ split-window -h -c '#{pane_current_path}'
bind-key _ split-window -v -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'

setw -g mode-keys vi
bind h select-pane -L
bind C-h select-pane -L
bind j select-pane -D
bind C-j select-pane -D
bind k select-pane -U
bind C-k select-pane -U
bind l select-pane -R
bind C-l select-pane -R

# New Window

bind-key c new-window -c '#{pane_current_path}' -n 'zsh'

# Misc
set -g history-limit 10000
set -g base-index 1
setw -g aggressive-resize on
setw -g automatic-rename off
set -g default-terminal "screen-256color"
bind-key a send-prefix
set -s escape-time 0

# Status bar
set -g status-bg green

set -g status-left-length 50
set -g status-left ""
set -g status-left-style bg=red,fg=black

set -g status-right-length 50
set -g status-right "#S"
set -g status-right-style bg=red,fg=black

set -g status-justify "left"

setw -g window-status-style bg=green,fg=black
setw -g window-status-format "#I:[#W]"

setw -g window-status-current-style bg=cyan,fg=black
setw -g window-status-current-format "#I:[#W]"

# Clipboard fixes
set -g allow-passthrough on
set -s set-clipboard on

# Mouse support
set -g mouse on

# Double/triple click: select a word/line, copy it, and stay in copy mode.
# A drag after that extends the selection by word/line.
# The default MouseDragEnd1Pane binding copies the final selection and leaves copy mode.
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear
bind -n DoubleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M  } { copy-mode -H ; send -X select-word ; send -X copy-pipe-no-clear  }
bind -n TripleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M  } { copy-mode -H ; send -X select-line ; send -X copy-pipe-no-clear  }

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-resurrect'

# This doesn't work very well...
#set -g @resurrect-strategy-vim 'session'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
